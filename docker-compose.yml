services:
  # ==========================
  # PostgreSQL cho Auth Service
  # ==========================
  postgres-auth:
    image: postgres:15-alpine
    container_name: cruise_postgres_auth
    restart: always
    environment:
      POSTGRES_DB: auth_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d auth_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Tour Service
  # ==========================
  postgres-tour:
    image: postgres:15-alpine
    container_name: cruise_postgres_tour
    restart: always
    environment:
      POSTGRES_DB: tour_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432" # Map cổng 5433 ra máy thật
    volumes:
      - postgres_tour_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d tour_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Convenience Service
  # ==========================
  postgres-convenience:
    image: postgres:15-alpine
    container_name: cruise_postgres_convenience
    restart: always
    environment:
      POSTGRES_DB: convenience_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432" # Map cổng 5434 ra máy thật
    volumes:
      - postgres_convenience_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d convenience_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # Redis
  # ==========================
  redis:
    image: redis:8-alpine
    container_name: cruise_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # Zookeeper (Bắt buộc cho Kafka)
  # ==========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cruise_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ==========================
  # Apache Kafka
  # ==========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cruise_kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Cấu hình tự động dọn dẹp log local
      KAFKA_LOG_RETENTION_MS: 3600000 # Xóa message sau 1 giờ
      KAFKA_LOG_RETENTION_BYTES: 1073741824 # Giới hạn dung lượng tối đa 1 GB
      KAFKA_LOG_SEGMENT_BYTES: 104857600 # Mỗi file segment tối đa 100 MB
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000 # Quét dọn dẹp mỗi 5 phút
    depends_on:
      - zookeeper

  # ==========================
  # pgAdmin
  # ==========================
  pgadmin:
    image: dpage/pgadmin4
    container_name: cruise_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cruise.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    logging:
      driver: "none"
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-tour:
        condition: service_healthy
      postgres-convenience:
        condition: service_healthy

  # ==========================
  # API Gateway
  # ==========================
  gateway-service:
    build:
      context: ./backend/gateway-service
      dockerfile: Dockerfile.dev
    container_name: gateway-service
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./backend/gateway-service:/app
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      ACTIVITY_SERVICE_URL: http://activity-service:8083
      CONVENIENCE_SERVICE_URL: http://convenience-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      NOTIFICATION_SERVICE_URL: http://notification-service:8086
      FEEDBACK_SERVICE_URL: http://feedback-service:8087
      TOUR_SERVICE_URL: http://tour-service:8088
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - auth-service
      - tour-service
      - convenience-service

  # ==========================
  # Auth Service
  # ==========================
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile.dev
    container_name: auth-service
    restart: always
    ports:
      - "8081:8081"
    working_dir: /app/auth-service
    volumes:
      - ./backend/auth-service/src:/app/auth-service/src
      - ./backend/common/src:/app/common/src
      - /app/auth-service/target
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-auth_service_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================
  # Tour Service
  # ==========================
  tour-service:
    build:
      context: ./backend
      dockerfile: tour-service/Dockerfile.dev
    container_name: tour-service
    restart: always
    ports:
      - "8088:8088"
    working_dir: /app/tour-service
    volumes:
      - ./backend/tour-service/src:/app/tour-service/src
      - ./backend/common/src:/app/common/src
      - /app/tour-service/target
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-tour:5432/${TOUR_DB_NAME:-tour_service_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-tour:
        condition: service_healthy
      kafka:
        condition: service_started

  # ==========================
  # Convenience Service
  # ==========================
  convenience-service:
    build:
      context: ./backend
      dockerfile: convenience-service/Dockerfile.dev
    container_name: convenience-service
    restart: always
    ports:
      - "8084:8084"
    working_dir: /app/convenience-service
    volumes:
      - ./backend/convenience-service/src:/app/convenience-service/src
      - ./backend/common/src:/app/common/src
      - /app/convenience-service/target
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-convenience:5432/${CONVENIENCE_DB_NAME:-convenience_service_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      postgres-convenience:
        condition: service_healthy
      kafka:
        condition: service_started

  # ==========================
  # React Frontend
  # ==========================
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.dev
    container_name: cruise_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - gateway-service

# ==========================
# Volumes
# ==========================
volumes:
  postgres_auth_data:
  postgres_tour_data:
  postgres_convenience_data:
  kafka_data:
