      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      BOOKING_SERVICE_URL: http://booking-service:8082
      # NOTIFICATION_SERVICE_URL: http://notification-service:8086  # TẠM COMMENT: chưa triển khai
    depends_on:
      postgres-payment:
        condition: service_healthy
      booking-service:
        condition: service_started
      # notification-service:      # TẠM COMMENT: chưa triển khai
      #   condition: service_started
      kafka:
        condition: service_started

  # ==========================
