services:
  # ==========================
  # PostgreSQL cho Auth Service
  # ==========================
  postgres-auth:
    image: postgres:15-alpine
    container_name: cruise_postgres_auth
    restart: always
    environment:
      POSTGRES_DB: auth_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_auth_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d auth_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Tour Service
  # ==========================
  postgres-tour:
    image: postgres:15-alpine
    container_name: cruise_postgres_tour
    restart: always
    environment:
      POSTGRES_DB: tour_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5433:5432" # Map cổng 5433 ra máy thật
    volumes:
      - postgres_tour_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d tour_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Booking Service
  # ==========================
  postgres-booking:
    image: postgres:15-alpine
    container_name: cruise_postgres_booking
    restart: always
    environment:
      POSTGRES_DB: booking_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5437:5432"
    volumes:
      - postgres_booking_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d booking_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Convenience Service
  # ==========================
  postgres-convenience:
    image: postgres:15-alpine
    container_name: cruise_postgres_convenience
    restart: always
    environment:
      POSTGRES_DB: convenience_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5434:5432" # Map cổng 5434 ra máy thật
    volumes:
      - postgres_convenience_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d convenience_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Activity Cruise Service
  # ==========================
  postgres-activity-cruise:
    image: postgres:15-alpine
    container_name: postgres_activity_cruise
    restart: always
    environment:
      POSTGRES_DB: activity_cruise_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5435:5432"
    volumes:
      - postgres_activity_cruise_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d activity_cruise_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Activity Visit Service
  # ==========================
  postgres-activity-visit:
    image: postgres:15-alpine
    container_name: postgres_activity_visit
    restart: always
    environment:
      POSTGRES_DB: activity_visit_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5436:5432"
    volumes:
      - postgres_activity_visit_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d activity_visit_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Payment Service
  # ==========================
  postgres-payment:
    image: postgres:15-alpine
    container_name: cruise_postgres_payment
    restart: always
    environment:
      POSTGRES_DB: payment_service_db
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5438:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d payment_service_db",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # PostgreSQL cho Notification Service
  # TẠM COMMENT: notification-service chưa code xong
  # ==========================
  # postgres-notification:
  #   image: postgres:15-alpine
  #   container_name: cruise_postgres_notification
  #   restart: always
  #   environment:
  #     POSTGRES_DB: notification_service_db
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #   ports:
  #     - "5439:5432"
  #   volumes:
  #     - postgres_notification_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test:
  #       [
  #         "CMD-SHELL",
  #         "pg_isready -U $${POSTGRES_USER:-postgres} -d notification_service_db",
  #       ]
  #     interval: 10s
  #     timeout: 5s
