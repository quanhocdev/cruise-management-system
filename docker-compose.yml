  # ==========================
  # Redis
  # ==========================
  redis:
    image: redis:8-alpine
    container_name: cruise_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================
  # Zookeeper (Bắt buộc cho Kafka)
  # ==========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: cruise_zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # ==========================
  # Apache Kafka
  # ==========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: cruise_kafka
    restart: always
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_OFFSETS_TOPIC_NUM_PARTITIONS: 1
      KAFKA_LOG4J_ROOT_LOGLEVEL: "WARN"
      KAFKA_LOG4J_LOGGERS: "kafka=WARN,kafka.controller=WARN,kafka.cluster=WARN,state.change.logger=WARN"
      KAFKA_LOG_RETENTION_MS: 3600000
      KAFKA_LOG_RETENTION_BYTES: 1073741824
      KAFKA_LOG_SEGMENT_BYTES: 104857600
      KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS: 300000
    depends_on:
      - zookeeper

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: cruise_kafka_ui
    restart: always
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      - kafka

  # ==========================
  # pgAdmin
  # ==========================
  pgadmin:
    image: dpage/pgadmin4
    container_name: cruise_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cruise.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    logging:
      driver: "none"
    depends_on:
      postgres-auth:
        condition: service_healthy
      postgres-tour:
        condition: service_healthy
      postgres-convenience:
        condition: service_healthy
      postgres-activity-cruise:
        condition: service_healthy
      postgres-activity-visit:
        condition: service_healthy
      postgres-booking:
        condition: service_healthy
      postgres-payment:
        condition: service_healthy
      # postgres-notification:   # TẠM COMMENT: chưa triển khai
      #   condition: service_healthy
      # postgres-feedback:       # TẠM COMMENT: chưa triển khai
      #   condition: service_healthy

  # ==========================
  # API Gateway
  # ==========================
  gateway-service:
    build:
      context: ./backend/gateway-service
      dockerfile: Dockerfile.dev
    container_name: gateway-service
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./backend/gateway-service:/app
    env_file:
      - .env
    environment:
      AUTH_SERVICE_URL: http://auth-service:8081
      BOOKING_SERVICE_URL: http://booking-service:8082
      ACTIVITY_SERVICE_URL: http://activity-cruise-service:8083
      CONVENIENCE_SERVICE_URL: http://convenience-service:8084
      PAYMENT_SERVICE_URL: http://payment-service:8085
      # NOTIFICATION_SERVICE_URL: http://notification-service:8086  # TẠM COMMENT: chưa triển khai
      ACTIVITY_VISIT_SERVICE_URL: http://activity-visit-service:8087
      TOUR_SERVICE_URL: http://tour-service:8088
      # FEEDBACK_SERVICE_URL: http://feedback-service:8089          # TẠM COMMENT: chưa triển khai
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      - auth-service
      - tour-service
      - convenience-service
      - activity-cruise-service
      - activity-visit-service
      - booking-service
      - payment-service
      # - notification-service   # TẠM COMMENT: chưa triển khai
      # - feedback-service       # TẠM COMMENT: chưa triển khai

  # ==========================
  # Auth Service
  # ==========================
  auth-service:
    build:
      context: ./backend
      dockerfile: auth-service/Dockerfile.dev
    container_name: auth-service
    restart: always
    ports:
      - "8081:8081"
    working_dir: /app/auth-service
    volumes:
      - ./backend/auth-service/src:/app/auth-service/src
      - ./backend/common/src:/app/common/src
      - /app/auth-service/target
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-auth:5432/${AUTH_DB_NAME:-auth_service_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
    depends_on:
      postgres-auth:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ==========================
  # Tour Service
  # ==========================
  tour-service:
    build:
      context: ./backend
      dockerfile: tour-service/Dockerfile.dev
    container_name: tour-service
    restart: always
    ports:
      - "8088:8088"
    working_dir: /app/tour-service
    volumes:
      - ./backend/tour-service/src:/app/tour-service/src
      - ./backend/common/src:/app/common/src
      - /app/tour-service/target
    env_file:
      - .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-tour:5432/${TOUR_DB_NAME:-tour_service_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      NOMINATIM_URL: ${NOMINATIM_URL:-https://nominatim.openstreetmap.org}
    depends_on:
      postgres-tour:
        condition: service_healthy
      kafka:
        condition: service_started

  # ==========================
  # Convenience Service
  # ==========================
