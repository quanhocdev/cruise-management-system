  #   container_name: cruise_postgres_feedback
  #   restart: always
  #   environment:
  #     POSTGRES_DB: feedback_service_db
  #     POSTGRES_USER: ${POSTGRES_USER:-postgres}
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
  #   ports:
