  # ==========================
  # React Frontend
  # ==========================
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.dev
    container_name: cruise_frontend
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend-web:/app
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    depends_on:
      - gateway-service

# ==========================
