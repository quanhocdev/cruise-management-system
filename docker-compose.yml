services:
  # 1. PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: cruise_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cruise_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_cruise_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-cruise_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. pgAdmin (Giao diện quản lý PostgreSQL)
  pgadmin:
    image: dpage/pgadmin4
    container_name: cruise_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@cruise.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      - postgres

  # 3. Spring Boot Backend (Development)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: cruise_backend
    restart: always
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-cruise_db}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy

  # 4. React Frontend (Development with Hot-reload)
  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile.dev
    container_name: cruise_frontend
    restart: always
    ports:
      - "5173:5173" # Lưu ý: Port truy cập Vite là 5173
    volumes:
      - ./frontend-web:/app # Đã sửa từ ./frontend thành ./frontend-web
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_cruise_data:
