# /resource/application-dev.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/cruise_db
spring.datasource.username=postgres
spring.datasource.password=postgres_password_123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Config for PostgreSQL
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Server Port
server.port=8080

# Logging level
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.cruise=DEBUG