# ==========================
# App & Spring Core
# ==========================
spring.application.name=cruise
spring.profiles.active=dev
server.port=8081

# TẮT BANNER ASCII SPRING BOOT
spring.main.banner-mode=off

# Bỏ qua thư mục target/build để chặn DevTools restart liên tục
spring.devtools.restart.exclude=static/**,public/**,target/**,.git/**
spring.devtools.add-properties=false

# ==========================
# Database & Datasource
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/auth_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Config
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# TẮT IN SQL RA CONSOLE (Giảm rác log)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# Logging Configuration
# ==========================
# Tắt log rác từ Hibernate, Framework & Connection Pool
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.org.hibernate.SQL=OFF
logging.level.org.hibernate.type.descriptor.sql=OFF
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.com.zaxxer.hikari=WARN

# Chỉ giữ lại log từ code dự án của bạn
logging.level.com.cruise=INFO

# ==========================
# Network, Upload & Path
# ==========================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
server.max-http-header-size=10MB
server.tomcat.max-swallow-size=100MB
server.tomcat.max-http-form-post-size=100MB
spring.mvc.pathmatch.matching-strategy=ant_path_matcher

# ==========================
# JWT Configuration
# ==========================
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION}

# ==========================
# Mail Configuration
# ==========================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true