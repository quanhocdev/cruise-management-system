# ==========================
# Core Configuration
# ==========================
spring.application.name=convenience-service
server.port=8084

# TẮT BANNER ASCII SPRING BOOT
spring.main.banner-mode=off

# ==========================
# Database & Datasource
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/convenience_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Config
spring.jpa.properties.hibernate.default_schema=convenience
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# TẮT IN SQL RA CONSOLE (Giúp bớt rác log khi query dữ liệu)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================
# Logging Configuration
# ==========================
logging.level.root=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=WARN

# ==========================
# Actuator / Security / Keys
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET:cruise-management-system-local-secret-key-2026}
internal.api-key=${INTERNAL_API_KEY:local-internal-api-key-change-me}

# ==========================
# Kafka Configuration (Consumer)
# ==========================
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=convenience-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.project.common.event

logging.level.org.apache.kafka=WARN
logging.level.org.apache.kafka.clients.consumer.ConsumerConfig=WARN