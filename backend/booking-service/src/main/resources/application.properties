# ==========================
# Core Configuration
# ==========================
spring.application.name=booking-service
server.port=8082

# TẮT BANNER ASCII SPRING BOOT
spring.main.banner-mode=off
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
# ==========================
# Database & Datasource
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-booking:5432/booking_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.default_schema=booking
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.project.booking=DEBUG
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=DEBUG
# ==========================
# Actuator / Security / Keys
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

tour-service.url=${TOUR_SERVICE_URL:http://tour-service:8088}

# ==========================
# Service-to-Service OAuth2
# ==========================
auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}
service.oauth2.client-id=${SERVICE_OAUTH2_CLIENT_ID:booking-service}
service.oauth2.client-secret=${SERVICE_OAUTH2_CLIENT_SECRET:booking-service-secret}
service.oauth2.scope=${SERVICE_OAUTH2_SCOPE:tour.read}

notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
booking.departure-reminder.cron=${BOOKING_DEPARTURE_REMINDER_CRON:0 0 8 * * *}
booking.departure-reminder.zone=${BOOKING_DEPARTURE_REMINDER_ZONE:Asia/Ho_Chi_Minh}

# ==========================
# Redis Configuration
# ==========================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:cruise_redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}


# ==========================
# Resilience4j - Tour Service
# ==========================

# Circuit Breaker
resilience4j.circuitbreaker.instances.tourService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.tourService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.tourService.sliding-window-size=10
resilience4j.circuitbreaker.instances.tourService.wait-duration-in-open-state=10s

# Retry
resilience4j.retry.instances.tourService.max-attempts=2
resilience4j.retry.instances.tourService.wait-duration=200ms


# ==========================
# Resilience4j - Payment Service
# ==========================

# Circuit Breaker
resilience4j.circuitbreaker.instances.paymentService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.paymentService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.paymentService.sliding-window-size=10
resilience4j.circuitbreaker.instances.paymentService.wait-duration-in-open-state=10s

# Retry
resilience4j.retry.instances.paymentService.max-attempts=2
resilience4j.retry.instances.paymentService.wait-duration=200ms