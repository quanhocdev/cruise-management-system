# ==========================
# Core Configuration
# ==========================
spring.application.name=booking-service
server.port=8082

# TẮT BANNER ASCII SPRING BOOT
spring.main.banner-mode=off
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
# ==========================
# Database & Datasource
# ==========================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres-booking:5432/booking_service_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.jpa.properties.hibernate.default_schema=booking
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# logging
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.project.booking=DEBUG
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=DEBUG
# ==========================
# Actuator / Security / Keys
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

jwt.secret=${JWT_SECRET:cruise-management-system-local-secret-key-2026}
internal.api-key=${INTERNAL_API_KEY:local-internal-api-key-change-me}
tour-service.url=${TOUR_SERVICE_URL:http://tour-service:8088}
notification-service.url=${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
booking.departure-reminder.cron=${BOOKING_DEPARTURE_REMINDER_CRON:0 0 8 * * *}
booking.departure-reminder.zone=${BOOKING_DEPARTURE_REMINDER_ZONE:Asia/Ho_Chi_Minh}

# ==========================
# Redis Configuration
# ==========================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:cruise_redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
