spring.application.name=payment-service
server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/cruise_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres_password_123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.default_schema=payment
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,info
jwt.secret=${JWT_SECRET:cruise-management-system-local-secret-key-2026}

vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.payment-url=${VNPAY_PAYMENT_URL:https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay/return}
vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/api/v1/payments/vnpay/ipn}
vnpay.frontend-result-url=${VNPAY_FRONTEND_RESULT_URL:http://localhost:5173/payment/result}
vnpay.payment-timeout-minutes=${VNPAY_PAYMENT_TIMEOUT_MINUTES:15}
booking-service.url=${BOOKING_SERVICE_URL:http://booking-service:8082}
internal.api-key=${INTERNAL_API_KEY:local-internal-api-key-change-me}
