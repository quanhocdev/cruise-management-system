spring.application.name=gateway-service
server.port=8080

services.auth.url=${AUTH_SERVICE_URL:http://localhost:8081}
services.booking.url=${BOOKING_SERVICE_URL:http://localhost:8082}
services.activity.url=${ACTIVITY_SERVICE_URL:http://localhost:8083}
services.convenience.url=${CONVENIENCE_SERVICE_URL:http://localhost:8084}
services.payment.url=${PAYMENT_SERVICE_URL:http://localhost:8085}
services.notification.url=${NOTIFICATION_SERVICE_URL:http://localhost:8086}
services.feedback.url=${FEEDBACK_SERVICE_URL:http://localhost:8087}
services.tour.url=${TOUR_SERVICE_URL:http://localhost:8088}

# Gateway 5 / Spring Cloud 2025.1 routes
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${services.auth.url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=booking-service
spring.cloud.gateway.server.webflux.routes[1].uri=${services.booking.url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/bookings/**

spring.cloud.gateway.server.webflux.routes[2].id=activity-service
spring.cloud.gateway.server.webflux.routes[2].uri=${services.activity.url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/activities/**,/api/shore-excursions/**

spring.cloud.gateway.server.webflux.routes[3].id=convenience-service
spring.cloud.gateway.server.webflux.routes[3].uri=${services.convenience.url}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/services/**,/api/products/**,/api/convenience/**

spring.cloud.gateway.server.webflux.routes[4].id=payment-service
spring.cloud.gateway.server.webflux.routes[4].uri=${services.payment.url}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/**,/api/bills/**

spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=${services.notification.url}
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.server.webflux.routes[6].id=feedback-service
spring.cloud.gateway.server.webflux.routes[6].uri=${services.feedback.url}
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/api/feedback/**

spring.cloud.gateway.server.webflux.routes[7].id=tour-service
spring.cloud.gateway.server.webflux.routes[7].uri=${services.tour.url}
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/api/tours/**,/api/cruises/**,/api/ports/**

# Avoid duplicate CORS headers returned by downstream services
spring.cloud.gateway.server.webflux.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin, RETAIN_FIRST

# JWT must match auth-service
jwt.secret=${JWT_SECRET}
jwt.issuer=cruise-app

# Browser clients
gateway.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# Logging
logging.level.org.springframework.cloud.gateway=INFO
logging.level.reactor.netty.http.client=INFO
