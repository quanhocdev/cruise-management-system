server:
  port: 8080

spring:
  application:
    name: gateway-service

  # TẮT BANNER ASCII SPRING BOOT
  main:
    banner-mode: "off"

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ==========================
            # AUTH SERVICE
            # ==========================

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**,/api/admin/staff/**

            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://booking-service:8082}
              predicates:
                - Path=/api/v1/bookings/**,/api/v1/check-in/**

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8085}
              predicates:
                - Path=/api/v1/payments/**

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
              predicates:
                - Path=/api/v1/notifications/**

            # ==========================
            # TOUR SERVICE - ADMIN
            # ==========================

            - id: tour-admin-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/admin/ports/**,/api/admin/cruises/**,/api/admin/decks/**,/api/admin/room-types/**,/api/admin/products/**,/api/admin/services/**,/api/admin/policies/**

            # ==========================
            # TOUR SERVICE - SCHEDULER
            # ==========================

            - id: tour-scheduler-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/scheduler/**

            # ==========================
            # TOUR SERVICE - OPERATION
            # ==========================

            - id: tour-operation-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/operation/**

            # ==========================
            # TOUR SERVICE - CONVENIENCE
            # ==========================

            - id: tour-convenience-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/convenience/**

            # ==========================
            # TOUR SERVICE - ONBOARD
            # ==========================

            - id: tour-onboard-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/onboard/**

            # ==========================
            # TOUR SERVICE - SHORE
            # ==========================

            - id: tour-shore-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/shore/**

          # ==========================
          # CORS
          # ==========================

          globalcors:
            add-to-simple-url-handler-mapping: true

            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:5173"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - "*"

                allowCredentials: true

                exposedHeaders:
                  - Authorization
                  - Set-Cookie

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
