server:
  port: 8080

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ==========================
            # AUTH SERVICE
            # ==========================

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**,/api/admin/staff/**

            # ==========================
            # TOUR SERVICE - ADMIN
            # ==========================

            - id: tour-admin-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/admin/ports/**,/api/admin/cruises/**,/api/admin/decks/**,/api/admin/room-types/**,/api/admin/products/**,/api/admin/services/**,/api/admin/policies/**

            # ==========================
            # TOUR SERVICE - SCHEDULER
            # ==========================

            - id: tour-scheduler-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/scheduler/**

            # ==========================
            # TOUR SERVICE - OPERATION
            # ==========================

            - id: tour-operation-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/operation/**

            # ==========================
            # TOUR SERVICE - CONVENIENCE
            # ==========================

            - id: tour-convenience-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/convenience/service-areas/**,/api/convenience/areas/**

          # ==========================
          # CORS
          # ==========================

          globalcors:
            add-to-simple-url-handler-mapping: true

            cors-configurations:
              "[/**]":
                allowedOrigins:
                  - "http://localhost:5173"

                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - PATCH
                  - DELETE
                  - OPTIONS

                allowedHeaders:
                  - "*"

                allowCredentials: true

                exposedHeaders:
                  - Authorization
                  - Set-Cookie

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web: INFO
    org.springframework.security: INFO
