server:
  port: 8080

spring:
  application:
    name: gateway-service

  webflux:
    codec:
      max-in-memory-size: 10MB

  main:
    banner-mode: "off"

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # ==========================
            # AUTH SERVICE
            # ==========================

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://auth-service:8081}
              predicates:
                - Path=/api/auth/**,/api/admin/staff/**

            # ==========================
            # PAYMENT SERVICE
            # ==========================

            - id: payment-service
              uri: ${PAYMENT_SERVICE_URL:http://payment-service:8085}
              predicates:
                - Path=/api/v1/payments/**,/api/passenger/payments/**

            # ==========================
            # NOTIFICATION SERVICE
            # ==========================

            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://notification-service:8086}
              predicates:
                - Path=/api/v1/notifications/**

            # ==========================
            # FEEDBACK SERVICE
            # ==========================

            - id: feedback-service
              uri: ${FEEDBACK_SERVICE_URL:http://feedback-service:8089}
              predicates:
                - Path=/api/v1/feedbacks/**,/api/admin/feedbacks/**

            # ==========================
            # TOUR SERVICE - ADMIN
            # ==========================

            - id: tour-admin-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/admin/**

            # ==========================
            # TOUR SERVICE - SCHEDULER
            # ==========================

            - id: tour-scheduler-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/scheduler/**

            # ==========================
            # TOUR SERVICE - OPERATION
            # ==========================

            - id: tour-operation-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/operation/**

            # ==========================
            # BOOKING SERVICE - WEBSOCKET
            # ==========================

            - id: booking-websocket
              uri: ws://booking-service:8082
              predicates:
                - Path=/ws-booking/**
                - Header=Upgrade,websocket

            # ==========================
            # BOOKING SERVICE - SOCKJS HTTP
            # ==========================

            - id: booking-sockjs
              uri: http://booking-service:8082
              predicates:
                - Path=/ws-booking/**

            # ==========================
            # BOOKING SERVICE - FINANCE
            # ==========================

            - id: booking-finance-service
              uri: ${BOOKING_SERVICE_URL:http://booking-service:8082}
              predicates:
                - Path=/api/finance/scan,/api/finance/bookings,/api/finance/bookings/**,/api/finance/check-passenger/**

            # ==========================
            # TOUR SERVICE - FINANCE
            # ==========================

            - id: tour-finance-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/finance/**

            # ==========================
            # TOUR SERVICE - PUBLIC
            # ==========================

            - id: tour-public-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/public/**

            # ==========================
            # TOUR SERVICE - CONVENIENCE
            # ==========================
            # Product / Service / ProductTour / ServiceTour
            # đã được merge vào tour-service

            - id: tour-convenience-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/convenience/**

            # ==========================
            # TOUR SERVICE - ACTIVITY CRUISE
            # ==========================
            # Activity Cruise đã được merge vào tour-service

            - id: tour-activity-cruise-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/onboard/**

            # ==========================
            # TOUR SERVICE - ACTIVITY VISIT
            # ==========================
            # Activity Visit đã được merge vào tour-service

            - id: tour-activity-visit-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/shore/**

            # ==========================
            # TOUR SERVICE - PASSENGER
            # ==========================

            - id: tour-passenger-service
              uri: ${TOUR_SERVICE_URL:http://tour-service:8088}
              predicates:
                - Path=/api/passenger/**

            # ==========================
            # BOOKING SERVICE - PASSENGER
            # ==========================

            - id: booking-service
              uri: ${BOOKING_SERVICE_URL:http://booking-service:8082}
              predicates:
                - Path=/api/passengers/**

jwt:
  secret: ${JWT_SECRET}

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.springframework.cloud.gateway: INFO
    org.springframework.web: INFO
    org.springframework.security: INFO
