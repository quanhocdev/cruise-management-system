# ==========================
# Core Configuration
# ==========================
spring.application.name=chat

# TẮT BANNER ASCII SPRING BOOT
spring.main.banner-mode=off

# ==========================
# Logging
# ==========================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.project.chat=DEBUG
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=DEBUG

# ==========================
# Actuator / Security / Keys
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================
# Service-to-Service OAuth2
# ==========================
auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

service.oauth2.client-id=${SERVICE_OAUTH2_CLIENT_ID:chat-service}
service.oauth2.client-secret=${SERVICE_OAUTH2_CLIENT_SECRET:chat-service-secret}
service.oauth2.scope=${SERVICE_OAUTH2_SCOPE:manager.read}