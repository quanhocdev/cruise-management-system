# ==========================
# Core Configuration
# ==========================
spring.application.name=chat
server.port=8091

# ==========================
# JPA / HIBERNATE
# ==========================

# Hibernate tự động cập nhật cấu trúc database
spring.jpa.hibernate.ddl-auto=update

# Schema mặc định
spring.jpa.properties.hibernate.default_schema=chat

# Cho phép Hibernate tự tạo schema nếu chưa tồn tại
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# Hiển thị SQL khi debug
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# TẮT BANNER ASCII SPRING BOOT
spring.main.banner-mode=off

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

# ==========================
# Logging
# ==========================
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.springframework.web=DEBUG
logging.level.com.project.chat=DEBUG
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.hibernate.SQL=DEBUG

# ==========================
# Actuator / Security / Keys
# ==========================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# ==========================
# Kafka Topics
# ==========================
app.kafka.topics.manager-status-changed=manager-status-changed-topic

# ==========================
# Service-to-Service OAuth2
# ==========================
auth-service.url=${AUTH_SERVICE_URL:http://auth-service:8081}

service.oauth2.client-id=${SERVICE_OAUTH2_CLIENT_ID:chat-service}
service.oauth2.client-secret=${SERVICE_OAUTH2_CLIENT_SECRET:chat-service-secret}
service.oauth2.scope=${SERVICE_OAUTH2_SCOPE:manager.read}
